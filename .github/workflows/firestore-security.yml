name: Firestore Security Regression

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools

      - name: Run Firestore security regression tests
        run: npx firebase emulators:exec --project demo-vericommit-rules --only firestore "node scripts/firestore-security-regression.cjs"
